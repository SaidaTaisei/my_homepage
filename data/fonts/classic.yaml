# Font pack matching the old Academic-theme site (data/fonts/my_noto_fonts.toml).
# The real fonts (Merriweather, Fira Sans, Source Code Pro) are self-hosted from static/fonts/ and set in
# layouts/_partials/hooks/head-end/classic-style.html. The families here are system stacks only so that the
# theme does not add a render-blocking Google Fonts request.

hugoblox:
  meta:
    format: "hugoblox-font@1"
    name: "Classic"
    vendor: "taisei-saida"
    version: "1.0.0"
    license: "MIT"
    style: "serif"
    description: "Merriweather headings with Fira Sans body, as on the old site"

  families:
    heading: "system-serif"
    body: "system-sans"
    code: "system-mono"

  weights:
    heading: [400]
    body: [400]
    code: [400]

  leading:
    heading: 1.25
    body: 1.6
    code: 1.5

  tracking:
    heading: "0"
    body: "0"

  variable:
    heading: false
    body: false
    code: false
